name: Build unsigned iOS IPA

# Триггеры:
#  - workflow_dispatch: ручной запуск из вкладки Actions (выбор версии Flutter и нужен ли Release)
#  - push: автоматическая сборка на каждый коммит в основную ветку
#
# Внимание: в этом репозитории основная ветка называется master. Указаны обе ветки,
# поэтому workflow продолжит работать после переименования master -> main.
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Версия Flutter SDK'
        required: false
        default: '3.41.6'
        type: string
      make_release:
        description: 'Создать GitHub Release с .ipa (иначе только artifact)'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master
    # Не пересобираем приложение из-за правок документации.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Сборка не подписывается, но Release создаётся — нужен доступ на запись к содержимому репозитория.
permissions:
  contents: write

# Две одновременные сборки одной ветки не нужны: новая отменяет предыдущую.
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия зафиксирована для воспроизводимости: проект собран на Flutter 3.41.6 (Dart 3.11.4).
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.41.6' }}
  # Промежуточное имя файла; финальное формируется с версией из pubspec.yaml.
  IPA_NAME: flutter_test_app-unsigned.ipa

jobs:
  build-ios:
    name: Build unsigned IPA (macOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Кэширует Flutter SDK и ~/.pub-cache (pub-кэш включается вместе с cache: true).
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          echo "--- Xcode ---"
          xcodebuild -version
          xcode-select -p
          echo "--- CocoaPods ---"
          pod --version || echo "CocoaPods пока не установлен"

      - name: Flutter pub get
        run: flutter pub get

      # Кэш CocoaPods: спецификации и уже установленные Pods.
      # Сейчас Podfile.lock отсутствует (плагинов нет), поэтому hashFiles вернёт пустую
      # строку — ключ останется стабильным, а кэш будет восстанавливаться по restore-keys.
      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods не найден на раннере — устанавливаю через RubyGems..."
            sudo gem install cocoapods --no-document
          fi
          pod --version

      # В проекте есть плагины (shared_preferences, home_widget), поэтому Flutter
      # использует CocoaPods. Podfile генерируется инструментами Flutter и в git не
      # хранится — создаём его заранее, иначе pod install упадёт с
      # "No Podfile found in the project directory".
      - name: Generate Podfile (config only)
        run: flutter build ios --config-only

      - name: CocoaPods install
        run: |
          cd ios
          if [ -f Podfile ]; then
            pod install
          else
            echo "Podfile не найден — пропускаю pod install (зависимости через Swift Package Manager)."
          fi

      # --no-codesign — сборка без подписи: .ipa подпишет SideStore/iloader при установке.
      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      # --- Виджет на главный экран ------------------------------------------------
      # Виджет собирается ОТДЕЛЬНЫМ Xcode-проектом (ios/TodoWidget), поэтому
      # Flutter-проект (ios/Runner.xcodeproj) остаётся неизменным.
      - name: Build widget extension
        run: |
          set -euo pipefail

          xcodebuild \
            -project ios/TodoWidget/TodoWidget.xcodeproj \
            -target TodoWidget \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/widget" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          echo "--- собранное расширение ---"
          ls -la build/widget

      - name: Embed widget into the app
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          WIDGET_PATH="build/widget/TodoWidget.appex"

          if [ ! -d "$APP_PATH" ]; then
            echo "Ошибка: не найден $APP_PATH" >&2
            exit 1
          fi
          if [ ! -d "$WIDGET_PATH" ]; then
            echo "Ошибка: расширение виджета не собралось ($WIDGET_PATH)" >&2
            exit 1
          fi

          mkdir -p "$APP_PATH/PlugIns"
          rm -rf "$APP_PATH/PlugIns/TodoWidget.appex"
          cp -R "$WIDGET_PATH" "$APP_PATH/PlugIns/"

          # Ad-hoc подпись с entitlements. App Group нужна, чтобы приложение и
          # виджет делили один контейнер с задачами. Установщик (iloader/SideStore)
          # переподпишет бандл своим сертификатом, но entitlements берёт из подписи —
          # поэтому подписываем сами, а не оставляем совсем без подписи.
          echo "--- подпись вложенных фреймворков ---"
          for framework in "$APP_PATH/Frameworks/"*.framework; do
            [ -e "$framework" ] || continue
            codesign --force --sign - "$framework"
          done

          echo "--- подпись расширения виджета ---"
          codesign --force --sign - \
            --entitlements ios/TodoWidget/TodoWidget/TodoWidget.entitlements \
            "$APP_PATH/PlugIns/TodoWidget.appex"

          echo "--- подпись приложения ---"
          codesign --force --sign - \
            --entitlements ios/Runner/Runner.entitlements \
            "$APP_PATH"

          echo "--- entitlements приложения ---"
          codesign -d --entitlements - "$APP_PATH" 2>&1 | head -20 || true
          echo "--- entitlements виджета ---"
          codesign -d --entitlements - "$APP_PATH/PlugIns/TodoWidget.appex" 2>&1 | head -20 || true

      - name: Determine app version
        id: app_version
        run: |
          RAW_VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          # Убираем символ "+" из build-номера: он неудобен в именах файлов и URL.
          SAFE_VERSION="${RAW_VERSION//+/-}"
          echo "raw=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "safe=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия приложения: $RAW_VERSION (в имени файла: $SAFE_VERSION)"

      # Упаковка .app в .ipa: в корне архива обязана лежать папка Payload с Runner.app.
      - name: Package unsigned .ipa
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Ошибка: не найден $APP_PATH — сборка не создала .app." >&2
            ls -la build/ios/ || true
            exit 1
          fi

          rm -rf build/ios/ipa_payload build/ios/unsigned
          mkdir -p build/ios/ipa_payload/Payload build/ios/unsigned
          cp -R "$APP_PATH" build/ios/ipa_payload/Payload/

          # -y обязателен: без него zip разворачивает симлинки внутри .app и приложение не запустится.
          (cd build/ios/ipa_payload && zip -qry "../unsigned/${IPA_NAME}" Payload)

          echo "Готовый файл:"
          ls -lh build/ios/unsigned/

      - name: Verify .ipa structure
        run: |
          set -euo pipefail
          IPA="build/ios/unsigned/${IPA_NAME}"
          echo "Содержимое архива (первые 15 записей):"
          unzip -l "$IPA" | head -15
          echo "--- Ключевые проверки ---"
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/Runner' \
            && echo "OK: Payload/Runner.app/Runner на месте" \
            || { echo "Ошибка: исполняемый файл приложения не найден в архиве" >&2; exit 1; }
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/Info.plist' \
            && echo "OK: Info.plist на месте" \
            || { echo "Ошибка: Info.plist не найден в архиве" >&2; exit 1; }
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/PlugIns/TodoWidget.appex/TodoWidget' \
            && echo "OK: расширение виджета на месте" \
            || { echo "Ошибка: расширение виджета отсутствует в .ipa" >&2; exit 1; }
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/PlugIns/TodoWidget.appex/Info.plist' \
            && echo "OK: Info.plist виджета на месте" \
            || { echo "Ошибка: Info.plist виджета отсутствует в .ipa" >&2; exit 1; }
          # По подписи установщик определяет entitlements (App Group для виджета).
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/_CodeSignature/CodeResources' \
            && echo "OK: подпись (ad-hoc) присутствует — entitlements перенесутся" \
            || echo "ВНИМАНИЕ: подписи в архиве нет, App Group может не активироваться."

      - name: Rename .ipa with version
        run: |
          set -euo pipefail
          mv "build/ios/unsigned/${IPA_NAME}" \
             "build/ios/unsigned/flutter_test_app-${{ steps.app_version.outputs.safe }}-unsigned.ipa"
          ls -lh build/ios/unsigned/

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: flutter-test-app-unsigned-ipa
          path: build/ios/unsigned/*.ipa
          if-no-files-found: error
          retention-days: 30

      # Публикация в Releases: так .ipa можно скачать прямо на iPhone по обычной ссылке
      # (Actions-артефакты требуют авторизации в GitHub — на телефоне это неудобно).
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.make_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.app_version.outputs.raw }}
        run: |
          set -euo pipefail

          TAG="ios-build-${GITHUB_RUN_NUMBER}"
          IPA_FILE=$(ls build/ios/unsigned/*.ipa | head -1)

          NOTES=$(cat <<EOF
          Неподписанный (unsigned) .ipa сборки Flutter-приложения с виджетом
          «Список дел» для главного экрана.

          - Версия приложения: ${APP_VERSION}
          - Flutter: ${FLUTTER_VERSION}
          - Коммит: ${GITHUB_SHA}
          - Виджет: расширение TodoWidget внутри Payload/Runner.app/PlugIns
          - Подпись: ad-hoc с App Group entitlement; при установке её заменит
            ваш установщик (iloader / SideStore).

          Как установить на iPhone:
          1. Скачайте \`.ipa\` на iPhone (Safari → «Загрузить»; файл попадёт в «Файлы»).
          2. Лучше ставить через iloader по кабелю: он подписывает вложенные
             расширения и переносит App Group entitlement. SideStore может
             ответить ошибкой 3014 «The provided app group is invalid».
          3. Добавьте виджет: длинное нажатие на рабочем столе → «+» →
             «Список дел» → выберите размер.
          4. Добавьте задачи в приложении — виджет обновится сам.

          Бесплатный Apple ID: 3 приложения (включая SideStore), 7 дней до переподписи.
          Важно: App Group официально требует платный Apple Developer (\$99/год).
          Если группа не активируется, виджет покажет «Задач пока нет».
          Подробности: docs/IOS_SIDESTORE_GUIDE.md
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — перезаливаю файл сборки."
            gh release upload "$TAG" "$IPA_FILE" --clobber
          else
            gh release create "$TAG" "$IPA_FILE" \
              --target "$GITHUB_SHA" \
              --title "iOS unsigned build #${GITHUB_RUN_NUMBER} (v${APP_VERSION})" \
              --notes "$NOTES"
          fi

          echo "Ссылка для скачивания на iPhone:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$IPA_FILE")"
